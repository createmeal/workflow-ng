
<mat-toolbar class="toolbar" color="primary">
    <div></div>
    <div>
        <input type="file" class="file-input" (change)="onImport($event)" #fileUpload hidden>
        <button class="button" mat-flat-button (click)="fileUpload.click()">Import</button>
        <button class="button" mat-flat-button (click)="onExport()">Export</button>
        <button class="button" mat-flat-button (click)="onSave()">Save</button>
        <button class="button" color="warn" mat-flat-button (click)="onClose()">X</button>
    </div>
</mat-toolbar>
<mat-drawer-container class="designer-container">
    <mat-drawer mode="side" opened>
        <div class="content">
            <mat-accordion class="pages-accordion" multi>
                <mat-expansion-panel>
                  <mat-expansion-panel-header>
                    <mat-panel-title>Pages</mat-panel-title>
                  </mat-expansion-panel-header>
                    <div class="pages-container">
                        <app-page-selector [items]="pages" (change)="onPageChange($event)"></app-page-selector>
                    </div>
                </mat-expansion-panel>
              </mat-accordion>
              <mat-accordion class="collections-accordion" multi>
                <mat-expansion-panel>
                  <mat-expansion-panel-header>
                    <mat-panel-title>General</mat-panel-title>
                  </mat-expansion-panel-header>
                    <div class="collections-container">
                        <app-step-selector [items]="generalSteps"></app-step-selector>
                    </div>
                </mat-expansion-panel>
              </mat-accordion>
              <mat-accordion class="collections-accordion" multi>
                <mat-expansion-panel>
                  <mat-expansion-panel-header>
                    <mat-panel-title>HTTP</mat-panel-title>
                  </mat-expansion-panel-header>
                    <div class="collections-container">
                        <app-step-selector [items]="httpSteps"></app-step-selector>
                    </div>
                </mat-expansion-panel>
              </mat-accordion>
        </div>
    </mat-drawer>
    <mat-drawer-content>
        <app-pages-toolbar [tabs]="pages"></app-pages-toolbar>
        <div #drawflow id="drawflow" (drop)="onDrop($event)" (dragover)="allowDrop($event)"></div>
    </mat-drawer-content>
    
    <mat-drawer class="step-properties-drawer" mode="over" position="end" [opened]="stepProperties.isVisible" (closed)="stepProperties.isVisible=false">
      <div class="header">
        <h3 class="title">{{stepProperties.name}}</h3>
        <button class="button" mat-flat-button (click)="stepProperties.isVisible=false">X</button>
      </div>
      <mat-divider></mat-divider>
      <h4>Properties</h4>
      <form class="form">
          @for (field of stepProperties.variables; track field.name) {
            <mat-form-field class="field" >
              <mat-label>{{field.name}}</mat-label>
              <input matInput [placeholder]="field.name" [value]="field.value">
            </mat-form-field> 
          }
      </form>
    </mat-drawer>
</mat-drawer-container>
